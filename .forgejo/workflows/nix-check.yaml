name: Nix Flake Check

on:
  push:
    branches:
      - main
      - forgejo
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: forgejo.bobtail-clownfish.ts.net/bcotton/nix-ci-runner:a0ddfa0
      options: --user root
    steps:
      - name: Setup SSH key for distributed builds
        env:
          NIX_BUILDER_KEY: ${{ secrets.NIX_BUILDER_KEY }}
        run: |
          install -d -m 700 /root/.ssh /run/secrets

          if [ -z "${NIX_BUILDER_KEY:-}" ]; then
            echo "::warning::NIX_BUILDER_KEY secret is not available; distributed KVM builders will be skipped"
            echo "NIX_BUILDERS_AVAILABLE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          # Forgejo secrets may store multiline SSH keys either as real newlines
          # or as escaped \n sequences. Decode both forms and strip CRLFs so
          # OpenSSH does not reject the key with "error in libcrypto".
          printf '%b' "$NIX_BUILDER_KEY" | tr -d '\r' > /run/secrets/nix-builder-key
          chmod 600 /run/secrets/nix-builder-key
          ssh-keygen -y -f /run/secrets/nix-builder-key >/dev/null
          echo "NIX_BUILDERS_AVAILABLE=1" >> "$GITHUB_ENV"

          # Override SSH config with aggressive keepalives for large transfers
          cat > /root/.ssh/config <<'SSHEOF'
          Host nas-01.lan nix-01.lan nix-02.lan nix-03.lan
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile /run/secrets/nix-builder-key
            IdentitiesOnly yes
            ServerAliveInterval 15
            ServerAliveCountMax 12
            TCPKeepAlive yes
            IPQoS throughput
          SSHEOF

      - name: Setup Nix environment
        run: |
          # Configure git for flakes
          git config --global user.email "actions@forgejo.local"
          git config --global user.name "Forgejo Actions"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better caching

      - name: Check Nix installation
        run: |
          nix --version
          git --version
          echo "Current directory: $(pwd)"
          echo "Git status:"
          git status || echo "Not a git repository or git not working"

      - name: Run nix flake check
        env:
          NIX_CONFIG: |
            stalled-download-timeout = 3600
            connect-timeout = 30
        run: |
          echo "Running nix flake check..."
          if [ "${NIX_BUILDERS_AVAILABLE:-0}" = "1" ]; then
            nix flake check --show-trace
          else
            echo "No distributed builders are available for this event; trying eval-only flake check."
            nix flake check --show-trace --no-build || echo "::warning::Eval-only flake check could not complete without builders; full validation will run when builder secrets are available."
          fi

      - name: Show flake info
        if: success() || failure()
        run: |
          echo "=== Flake Info ==="
          nix flake info --json | head -20 || true
          echo ""
          echo "=== Flake Metadata ==="
          nix flake metadata || true

  build-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    container:
      image: forgejo.bobtail-clownfish.ts.net/bcotton/nix-ci-runner:a0ddfa0
      options: --user root
    steps:
      - name: Setup SSH key for distributed builds
        env:
          NIX_BUILDER_KEY: ${{ secrets.NIX_BUILDER_KEY }}
        run: |
          install -d -m 700 /root/.ssh /run/secrets

          if [ -z "${NIX_BUILDER_KEY:-}" ]; then
            echo "::warning::NIX_BUILDER_KEY secret is not available; distributed KVM builders will be skipped"
            echo "NIX_BUILDERS_AVAILABLE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          # Forgejo secrets may store multiline SSH keys either as real newlines
          # or as escaped \n sequences. Decode both forms and strip CRLFs so
          # OpenSSH does not reject the key with "error in libcrypto".
          printf '%b' "$NIX_BUILDER_KEY" | tr -d '\r' > /run/secrets/nix-builder-key
          chmod 600 /run/secrets/nix-builder-key
          ssh-keygen -y -f /run/secrets/nix-builder-key >/dev/null
          echo "NIX_BUILDERS_AVAILABLE=1" >> "$GITHUB_ENV"

          # Override SSH config with aggressive keepalives for large transfers
          cat > /root/.ssh/config <<'SSHEOF'
          Host nas-01.lan nix-01.lan nix-02.lan nix-03.lan
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile /run/secrets/nix-builder-key
            IdentitiesOnly yes
            ServerAliveInterval 15
            ServerAliveCountMax 12
            TCPKeepAlive yes
            IPQoS throughput
          SSHEOF

      - name: Setup Nix environment
        run: |
          git config --global user.email "actions@forgejo.local"
          git config --global user.name "Forgejo Actions"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build all NixOS host configurations
        env:
          NIX_CONFIG: |
            stalled-download-timeout = 3600
            connect-timeout = 30
            builders-use-substitutes = true
        run: |
          echo "Building all NixOS host system closures..."
          if [ "${NIX_BUILDERS_AVAILABLE:-0}" != "1" ]; then
            echo "No distributed builders are available for this event; skipping host closure builds."
            exit 0
          fi

          all_hosts=$(nix eval --raw '.#nixosConfigurations' --apply 'x: builtins.concatStringsSep "\n" (builtins.attrNames x)')

          # Skip hosts with VM/container images that aren't in production yet
          skip="incus-testing nix-04"
          hosts=""
          skipped=""
          for h in $all_hosts; do
            case " $skip " in
              *" $h "*) skipped="$skipped $h" ;;
              *) hosts="${hosts:+$hosts$'\n'}$h" ;;
            esac
          done

          host_count=$(echo "$hosts" | wc -l)
          echo "Found $host_count hosts to build"
          if [ -n "$skipped" ]; then
            echo "Skipped (not in production):$skipped"
          fi

          # Pre-build diagnostics
          echo ""
          echo "::group::Nix store info (pre-build)"
          nix store info 2>&1 || true
          df -h /nix 2>/dev/null || true
          echo "::endgroup::"

          # Build ALL hosts in a single nix build invocation so the scheduler
          # sees the entire derivation graph, deduplicates shared work, and
          # distributes optimally across all remote builders.
          build_args=""
          for host in $hosts; do
            build_args="$build_args .#nixosConfigurations.${host}.config.system.build.toplevel"
          done

          echo ""
          echo "Building $host_count hosts in parallel..."
          echo "Targets:$build_args"
          echo ""

          total_start=$SECONDS
          build_exit=0
          nix build --keep-going --no-link $build_args 2>&1 || build_exit=$?
          total_elapsed=$(( SECONDS - total_start ))

          # Verify per-host results (instant dry-run for built hosts)
          echo ""
          echo "::group::Per-host verification"
          failed=""
          succeeded=""
          for host in $hosts; do
            drv=".#nixosConfigurations.${host}.config.system.build.toplevel"
            if nix build "$drv" --dry-run 2>&1 | grep -q "will be built"; then
              echo "  FAIL  $host"
              failed="$failed $host"
            else
              echo "  OK    $host"
              succeeded="$succeeded $host"
            fi
          done
          echo "::endgroup::"

          # Results summary
          echo ""
          echo "============================================"
          echo "Build Results (total: ${total_elapsed}s)"
          echo "============================================"
          for host in $hosts; do
            case " $failed " in
              *" $host "*) echo "  FAIL  $host" ;;
              *) echo "  OK    $host" ;;
            esac
          done
          echo "============================================"

          if [ -n "$failed" ]; then
            echo "FAILED hosts:$failed"
            exit 1
          else
            echo "All $host_count hosts built successfully in ${total_elapsed}s"
          fi
